name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  ping:
    name: Ping Supabase DB
    runs-on: ubuntu-latest
    steps:
      - name: Keep-alive — multiple database requests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          # Anon key only: anon has no access to members/payments (see
          # 002_remove_client_access.sql), so the ping goes through the
          # keep_alive() function from 005_keep_alive_function.sql, which runs
          # a query on the database and returns no data.
          # Several requests per run, instead of a single ping, to generate a
          # clearer activity signal for Supabase.
          # curl's --oauth2-bearer flag builds the required OAuth-style auth
          # header for us, from the same anon key used for "apikey".
          ENDPOINT="rpc/keep_alive"

          FAILED=0
          for attempt in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              --oauth2-bearer "${SUPABASE_ANON_KEY}" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Content-Type: application/json" \
              -d '{}' \
              "${SUPABASE_URL}/rest/v1/${ENDPOINT}")

            if [[ "$STATUS" =~ ^2 ]]; then
              echo "✅ ${ENDPOINT} (${attempt}/3) -> HTTP ${STATUS}"
            else
              echo "❌ ${ENDPOINT} (${attempt}/3) -> HTTP ${STATUS}"
              FAILED=1
            fi
          done

          if [[ "$FAILED" -eq 1 ]]; then
            echo "One or more keep-alive requests failed."
            exit 1
          fi
